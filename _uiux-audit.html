<!doctype html>
<meta charset="utf-8">
<title>UI/UX audit (dev only)</title>
<body style="background:#fff;font:13px monospace">
<pre id="out">running…</pre>
<script>
/* Dev-only: checks pages against the main rules of the ui-ux-pro-max skill (references/quick-reference.md):
   color-contrast (4.5:1 / 3:1 large), touch-target-size (44px on phone, 24px minimum), readable-font-size (>=12px),
   alt-text, heading-hierarchy, aria-labels on icon-only buttons, image-dimension, horizontal-scroll, viewport-meta. */
const pages = ["index.html", "shop.html", "shop.html?c=anime", "product.html?id=elbaf"];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const out = document.getElementById("out"); const log = [];
function lum([r, g, b]) { const f = c => (c /= 255) <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b); }
const parse = s => (s.match(/[\d.]+/g) || []).map(Number);
function bgOf(el, win) {   // first non-transparent background up the tree (images under text are skipped: reported as "on image")
  for (let e = el; e; e = e.parentElement) { const cs = win.getComputedStyle(e);
    if (cs.backgroundImage !== "none" && !/gradient/.test(cs.backgroundImage)) return null;
    const c = parse(cs.backgroundColor); if (c.length >= 3 && (c[3] === undefined || c[3] > 0.9)) return c.slice(0, 3); }
  return [11, 11, 11];
}
async function audit(url, w, lang) {
  const f = document.createElement("iframe"); f.style.cssText = `width:${w}px;height:900px;border:0;position:absolute;left:-9999px`; document.body.appendChild(f);
  f.contentWindow.localStorage.setItem("vision.lang", JSON.stringify(lang)); f.contentWindow.sessionStorage.setItem("vision.loaded", "1");
  f.src = url; await new Promise(r => f.onload = r); await sleep(1200);
  const d = f.contentDocument, win = f.contentWindow; d.querySelectorAll(".reveal").forEach(e => e.classList.add("in")); await sleep(300);
  const issues = {};
  const add = (k, v) => (issues[k] ||= new Set()).add(v);
  const visible = el => { const r = el.getBoundingClientRect(), cs = win.getComputedStyle(el); return r.width > 0 && r.height > 0 && cs.visibility !== "hidden" && +cs.opacity > 0.1 && !el.closest("[hidden],dialog:not([open]),.drawer:not(.open),.sr-only,.search-results"); };
  // contrast + font size
  const tw = d.createTreeWalker(d.body, NodeFilter.SHOW_TEXT);
  while (tw.nextNode()) { const n = tw.currentNode; const t = n.textContent.trim(); if (!t) continue; const el = n.parentElement; if (!el || !visible(el) || el.closest("script,style")) continue;
    const cs = win.getComputedStyle(el); const fs = parseFloat(cs.fontSize), fw = +cs.fontWeight;
    if (fs < 12 && !el.closest("[aria-hidden=true]")) add("font<12px", `${fs}px "${t.slice(0, 20)}"`);
    const bg = bgOf(el, win); if (!bg) continue; const fg = parse(cs.color); const a = fg[3] ?? 1;
    const mix = fg.slice(0, 3).map((c, i) => c * a + bg[i] * (1 - a)) ; const L1 = lum(mix), L2 = lum(bg); const cr = (Math.max(L1, L2) + .05) / (Math.min(L1, L2) + .05);
    const large = fs >= 24 || (fs >= 18.66 && fw >= 700); if (cr < (large ? 3 : 4.5)) add("contrast", `${cr.toFixed(2)} "${t.slice(0, 22)}"`); }
  // targets
  d.querySelectorAll("a[href],button,input,select,textarea,[role=radio],[role=tab]").forEach(el => { if (!visible(el)) return; const r = el.getBoundingClientRect();
    if (el.closest("p") && el.tagName === "A") return;   // inline text links are exempt
    const lab = (el.getAttribute("aria-label") || el.textContent || el.name || "").trim().slice(0, 18);
    if (r.width < 24 || r.height < 24) add("target<24px", `${Math.round(r.width)}x${Math.round(r.height)} ${el.tagName} "${lab}"`);
    else if (w < 768 && (r.width < 44 || r.height < 44)) add("target<44px(phone)", `${Math.round(r.width)}x${Math.round(r.height)} ${el.tagName} "${lab}"`);
    if ((el.tagName === "BUTTON" || el.tagName === "A") && !el.textContent.trim() && !el.getAttribute("aria-label") && !el.getAttribute("aria-labelledby")) add("no-accessible-name", el.outerHTML.slice(0, 60)); });
  // images
  d.querySelectorAll("img").forEach(img => { if (!img.hasAttribute("alt")) add("img-no-alt", img.src.split("/").slice(-2).join("/"));
    if (!img.getAttribute("width") || !img.getAttribute("height")) add("img-no-size", (img.getAttribute("src") || "").split("/").slice(-2).join("/")); });
  // headings
  let prev = 0; d.querySelectorAll("h1,h2,h3,h4,h5,h6").forEach(h => { const lv = +h.tagName[1]; if (prev && lv > prev + 1) add("heading-skip", `h${prev}→h${lv} "${h.textContent.trim().slice(0, 20)}"`); prev = lv; });
  if (d.querySelectorAll("h1").length !== 1) add("h1-count", d.querySelectorAll("h1").length);
  if (d.documentElement.scrollWidth > w + 1) add("horizontal-scroll", d.documentElement.scrollWidth);
  const vp = d.querySelector("meta[name=viewport]")?.content || ""; if (/user-scalable=no|maximum-scale=1/.test(vp)) add("zoom-disabled", vp);
  f.remove();
  return Object.fromEntries(Object.entries(issues).map(([k, v]) => [k, [...v]]));
}
(async () => {
  for (const p of pages) for (const [w, lang] of [[375, "ar"], [1440, "en"]]) {
    const r = await audit(p, w, lang); const keys = Object.keys(r);
    log.push(`${keys.length ? "ISSUES" : "OK    "} ${p} ${lang} ${w}`); keys.forEach(k => log.push(`   ${k} (${r[k].length}): ${r[k].slice(0, 6).join(" | ")}`));
    out.textContent = log.join("\n");
  }
  log.push("DONE"); out.textContent = log.join("\n"); window.__done = true;
})();
</script>
